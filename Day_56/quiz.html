<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 56 Quiz: Politeness & Diplomatic Phrasing</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-container {
      background: var(--card-bg);
      max-width: 680px;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .quiz-header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 24px 30px;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .quiz-header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .quiz-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 30px;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .timer {
      font-family: monospace;
      font-weight: 700;
      color: #b91c1c;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-body {
      padding: 28px 30px;
    }

    .question-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      text-align: left;
      transition: all 0.2s ease;
      color: var(--text);
      display: flex;
      align-items: center;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f8fafc;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: #eef2ff;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-bg);
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.incorrect {
      border-color: var(--danger);
      background: var(--danger-bg);
      color: #7f1d1d;
    }

    .explanation {
      margin-top: 18px;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .explanation.show {
      display: block;
    }

    .explanation.correct-exp {
      background: var(--success-bg);
      border-left: 4px solid var(--success);
      color: #14532d;
    }

    .explanation.incorrect-exp {
      background: var(--danger-bg);
      border-left: 4px solid var(--danger);
      color: #7f1d1d;
    }

    .quiz-footer {
      padding: 18px 30px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .score-view {
      padding: 40px 30px;
      text-align: center;
      display: none;
    }

    .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #eef2ff;
      border: 4px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    .score-view h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .score-view p {
      color: var(--text-muted);
      margin-bottom: 24px;
      font-size: 15px;
    }

    .review-list {
      text-align: left;
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .review-item {
      padding: 12px 16px;
      background: #f8fafc;
      border-radius: 8px;
      border-left: 4px solid var(--border);
      font-size: 13.5px;
    }

    .review-item.pass {
      border-left-color: var(--success);
    }

    .review-item.fail {
      border-left-color: var(--danger);
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="quiz-header">
    <div class="badge">Day 56 • Communication Mastery</div>
    <h1>Politeness & Diplomatic Phrasing</h1>
    <p>Test your ability to soften requests, give tactful feedback, and use indirect grammar.</p>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="status-bar" id="statusBar">
    <span id="questionCounter">Question 1 of 5</span>
    <span class="timer" id="timer">Time: 00:00</span>
  </div>

  <div class="quiz-body" id="quizBody">
    <div class="question-title" id="questionTitle">Loading question...</div>
    <div class="options" id="optionsContainer"></div>
    <div class="explanation" id="explanationBox"></div>
  </div>

  <div class="quiz-footer" id="quizFooter">
    <button class="btn btn-primary" id="nextBtn" disabled>Check Answer</button>
  </div>

  <div class="score-view" id="scoreView">
    <div class="score-circle" id="scoreValue">0/5</div>
    <h2 id="scoreTitle">Well Done!</h2>
    <p id="scoreSubtitle">You have completed the Politeness & Diplomatic Phrasing assessment.</p>
    <button class="btn btn-primary" id="restartBtn">Try Again</button>

    <div class="review-list" id="reviewContainer"></div>
  </div>
</div>

<script>
  const questions = [
    {
      question: "Which of the following sentences correctly uses 'Would you mind' to ask a colleague to open the window?",
      options: [
        "Would you mind to open the window, please?",
        "Would you mind opening the window, please?",
        "Would you mind if you open the window?",
        "Would you mind open the window, please?"
      ],
      correct: 1,
      explanation: "'Would you mind' must be followed directly by a gerund (verb-ing). Hence, 'Would you mind opening...' is the correct construction."
    },
    {
      question: "How should you answer if someone asks 'Would you mind if I borrowed your pen?' and you are happy to lend it?",
      options: [
        "Yes, of course you can take it.",
        "Yes, I would mind, go ahead.",
        "No, not at all! Here you go.",
        "Yes, no problem."
      ],
      correct: 2,
      explanation: "Since the question asks if you 'mind' (object/are bothered), answering 'No, not at all' confirms you do not object, politely granting permission."
    },
    {
      question: "Transform this blunt critique into diplomatic phrasing: 'This marketing plan makes no sense.'",
      options: [
        "This marketing plan is completely absurd to read.",
        "I was wondering why you wrote this marketing plan so poorly.",
        "The marketing plan feels a bit unclear in some areas; perhaps we could clarify key objectives together?",
        "You must rewrite the marketing plan because it makes no sense."
      ],
      correct: 2,
      explanation: "Using softening adverbs ('a bit unclear'), impersonal framing ('feels'), and collaborative forward proposals ('perhaps we could clarify...') produces tactful, constructive feedback."
    },
    {
      question: "Which structure represents the correct indirect question syntax for 'Where is the quarterly report?'",
      options: [
        "I was wondering where is the quarterly report.",
        "I was wondering if where the quarterly report is.",
        "I was wondering where the quarterly report is.",
        "Could you tell me where is situated the quarterly report?"
      ],
      correct: 2,
      explanation: "Indirect questions require normal declarative word order (Subject + Verb) rather than inverted question syntax: 'where [the quarterly report] (subject) [is] (verb)'."
    },
    {
      question: "Choose the sentence that best demonstrates the use of past continuous cushions for diplomatic timing:",
      options: [
        "I was hoping to grab five minutes of your time before the client arrives.",
        "I hope you give me five minutes right now.",
        "I am hoping that you will stop what you are doing and listen.",
        "I had hoped you did five minutes for me."
      ],
      correct: 0,
      explanation: "'I was hoping to...' uses the past continuous cushion to create social distance, avoiding pressure while expressing a polite request."
    }
  ];

  let currentIndex = 0;
  let selectedOption = null;
  let answered = false;
  let score = 0;
  let timerSeconds = 0;
  let timerInterval = null;
  const userAnswers = [];

  const progressBar = document.getElementById('progressBar');
  const questionCounter = document.getElementById('questionCounter');
  const timerEl = document.getElementById('timer');
  const questionTitle = document.getElementById('questionTitle');
  const optionsContainer = document.getElementById('optionsContainer');
  const explanationBox = document.getElementById('explanationBox');
  const nextBtn = document.getElementById('nextBtn');
  const quizBody = document.getElementById('quizBody');
  const quizFooter = document.getElementById('quizFooter');
  const statusBar = document.getElementById('statusBar');
  const scoreView = document.getElementById('scoreView');
  const scoreValue = document.getElementById('scoreValue');
  const scoreTitle = document.getElementById('scoreTitle');
  const scoreSubtitle = document.getElementById('scoreSubtitle');
  const reviewContainer = document.getElementById('reviewContainer');
  const restartBtn = document.getElementById('restartBtn');

  function startTimer() {
    clearInterval(timerInterval);
    timerSeconds = 0;
    timerInterval = setInterval(() => {
      timerSeconds++;
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      timerEl.textContent = `Time: ${mins}:${secs}`;
    }, 1000);
  }

  function renderQuestion() {
    answered = false;
    selectedOption = null;
    nextBtn.disabled = true;
    nextBtn.textContent = "Check Answer";
    explanationBox.className = "explanation";
    explanationBox.style.display = "none";
    explanationBox.textContent = "";

    const q = questions[currentIndex];
    questionTitle.textContent = `${currentIndex + 1}. ${q.question}`;
    questionCounter.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
    progressBar.style.width = `${((currentIndex) / questions.length) * 100}%`;

    optionsContainer.innerHTML = "";
    q.options.forEach((optText, i) => {
      const btn = document.createElement('button');
      btn.className = "option-btn";
      btn.textContent = optText;
      btn.addEventListener('click', () => selectOption(i, btn));
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(index, btn) {
    if (answered) return;
    selectedOption = index;
    const allBtns = optionsContainer.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    nextBtn.disabled = false;
  }

  nextBtn.addEventListener('click', () => {
    if (!answered) {
      // Check answer
      answered = true;
      const q = questions[currentIndex];
      const isCorrect = (selectedOption === q.correct);
      if (isCorrect) score++;
      userAnswers.push({
        question: q.question,
        selected: selectedOption,
        correct: q.correct,
        options: q.options,
        explanation: q.explanation,
        isCorrect: isCorrect
      });

      const allBtns = optionsContainer.querySelectorAll('.option-btn');
      allBtns.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add('correct');
        else if (i === selectedOption) btn.classList.add('incorrect');
      });

      explanationBox.style.display = "block";
      explanationBox.className = `explanation ${isCorrect ? 'correct-exp' : 'incorrect-exp'} show`;
      explanationBox.innerHTML = `<strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong> ${q.explanation}`;

      if (currentIndex === questions.length - 1) {
        nextBtn.textContent = "See Final Results";
      } else {
        nextBtn.textContent = "Next Question";
      }
    } else {
      // Go to next question or complete
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    }
  });

  function showResults() {
    clearInterval(timerInterval);
    progressBar.style.width = "100%";
    quizBody.style.display = "none";
    quizFooter.style.display = "none";
    statusBar.style.display = "none";
    scoreView.style.display = "block";

    scoreValue.textContent = `${score}/${questions.length}`;

    if (score === questions.length) {
      scoreTitle.textContent = "Outstanding Mastery!";
      scoreSubtitle.textContent = "Flawless performance! You excel at diplomatic and polite communication.";
    } else if (score >= 3) {
      scoreTitle.textContent = "Solid Understanding!";
      scoreSubtitle.textContent = "Good job! A quick review of indirect question syntax and cushions will make you bulletproof.";
    } else {
      scoreTitle.textContent = "Review Recommended";
      scoreSubtitle.textContent = "Take another look at the notes, especially past continuous softeners and 'Would you mind' rules.";
    }

    reviewContainer.innerHTML = "";
    userAnswers.forEach((ans, i) => {
      const item = document.createElement('div');
      item.className = `review-item ${ans.isCorrect ? 'pass' : 'fail'}`;
      item.innerHTML = `
        <strong>Q${i + 1}: ${ans.question}</strong><br>
        <span style="color: ${ans.isCorrect ? '#16a34a' : '#dc2626'}">
          Your Answer: ${ans.options[ans.selected]}
        </span><br>
        ${!ans.isCorrect ? `<span style="color: #16a34a">Correct: ${ans.options[ans.correct]}</span><br>` : ''}
        <em>Explanation: ${ans.explanation}</em>
      `;
      reviewContainer.appendChild(item);
    });
  }

  restartBtn.addEventListener('click', () => {
    currentIndex = 0;
    score = 0;
    userAnswers.length = 0;
    quizBody.style.display = "block";
    quizFooter.style.display = "flex";
    statusBar.style.display = "flex";
    scoreView.style.display = "none";
    startTimer();
    renderQuestion();
  });

  startTimer();
  renderQuestion();
</script>

</body>
</html>
