<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 66 Quiz: Technical Documentation & System Architecture</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --accent: #818cf8;
      --option-bg: #334155;
      --option-hover: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .timer {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 9999px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-count {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
      color: #ffffff;
    }

    .code-snippet {
      background: #090d16;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      color: #38bdf8;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .option {
      background: var(--option-bg);
      border: 2px solid transparent;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: var(--text);
    }

    .option:hover {
      background: var(--option-hover);
      border-color: #475569;
    }

    .option.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
    }

    .option-letter {
      background: rgba(255, 255, 255, 0.1);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .option.selected .option-letter {
      background: var(--primary);
      color: #0f172a;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-prev {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .btn-prev:hover:not(:disabled) {
      background: #334155;
      color: var(--text);
    }

    .btn-next {
      background: var(--primary);
      color: #0f172a;
    }

    .btn-next:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Score & Review Page */
    .result-container {
      text-align: center;
      padding: 10px 0;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: conic-gradient(var(--primary) calc(var(--percent) * 1%), #334155 0);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .score-circle-inner {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .score-total {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .result-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-desc {
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .review-list {
      text-align: left;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .review-item {
      background: #151e2e;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
    }

    .review-question {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .review-status {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .status-correct {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
    }

    .status-incorrect {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .review-ans {
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .review-ans span {
      font-weight: 600;
      color: var(--text);
    }

    .review-explanation {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #334155;
      font-size: 0.85rem;
      color: #38bdf8;
      line-height: 1.4;
    }

    .btn-restart {
      margin-top: 24px;
      background: var(--accent);
      color: #ffffff;
      padding: 12px 28px;
    }

    .btn-restart:hover {
      background: #6366f1;
    }
  </style>
</head>
<body>

<div class="container" id="quiz-card">
  <div class="header">
    <span class="badge">Day 66 • Reading Comprehension</span>
    <span class="timer" id="timer-display">⏱ 00:00</span>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div id="quiz-body">
    <div class="question-count" id="q-counter">Question 1 of 5</div>
    <div class="question-text" id="q-text">Loading question...</div>
    <div id="q-snippet" class="code-snippet" style="display: none;"></div>

    <div class="options" id="options-container">
      <!-- Options injected by JS -->
    </div>

    <div class="footer">
      <button class="btn btn-prev" id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
      <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">Next</button>
    </div>
  </div>

  <div id="result-view" style="display: none;">
    <!-- Injected after submission -->
  </div>
</div>

<script>
  const questions = [
    {
      question: "According to IETF RFC 2119 standards in technical documentation, what does the keyword 'SHOULD' convey?",
      snippet: "\"Downstream components MAY emit callbacks; however, the client SHOULD NOT block active worker threads.\"",
      options: [
        "An absolute, non-negotiable requirement necessary for compliance.",
        "A strong recommendation where valid reasons may exist to deviate, but the full trade-offs must be understood.",
        "An optional feature that has no impact on system stability or architecture.",
        "A deprecated behavior that will trigger an immediate compiler or runtime error."
      ],
      answer: 1,
      explanation: "RFC 2119 defines 'SHOULD' / 'RECOMMENDED' as a strong default recommendation. While valid exceptions may exist in special circumstances, the engineer must fully comprehend the consequences of ignoring it."
    },
    {
      question: "What is the primary rationale for enforcing idempotency keys in an asynchronous ingestion pipeline?",
      snippet: "\"Inbound payloads that pass validation MUST be enriched with an RFC 4122 UUIDv4 idempotency key...\"",
      options: [
        "To encrypt sensitive customer data in transit between the API Gateway and Kafka.",
        "To compress the JSON payload and reduce network bandwidth consumption.",
        "To prevent duplicate side effects when messages are retried under an at-least-once delivery guarantee.",
        "To automatically convert synchronous REST endpoints into asynchronous GraphQL subscriptions."
      ],
      answer: 2,
      explanation: "In systems featuring 'at-least-once' delivery, network re-transmissions and consumer retries inevitably produce duplicate messages. Idempotency keys allow consumers to identify and disregard previously processed payloads."
    },
    {
      question: "In the CloudSync architecture passage, why does the API Gateway partition messages into Kafka by 'tenant_id' instead of writing them synchronously to PostgreSQL?",
      options: [
        "To guarantee message ordering per tenant while decoupling high ingress volume from database load.",
        "Because PostgreSQL does not support relational schemas for multi-tenant applications.",
        "To bypass edge TLS termination and rate-limiting constraints.",
        "To allow consumers to discard dead-letter queues entirely."
      ],
      answer: 0,
      explanation: "Partitioning by 'tenant_id' maintains strict temporal ordering for each individual tenant's events while asynchronously buffering traffic so high spikes (50,000+ RPS) do not overwhelm the relational database."
    },
    {
      question: "What operational sequence occurs when a downstream consumer encounters an unrecoverable validation error in the specification?",
      options: [
        "The consumer instantly terminates the Kafka broker and sends a 500 error to the client.",
        "The consumer retries indefinitely until manual administrator intervention.",
        "The message is dropped immediately without recording any error logs.",
        "The consumer executes three exponential backoff retries (200ms, 800ms, 3200ms) before routing to a DLQ."
      ],
      answer: 3,
      explanation: "The architecture text states: '...it SHALL route the message to a Dead Letter Queue (DLQ) after three exponential backoff retry attempts (intervals: 200ms, 800ms, 3200ms).'"
    },
    {
      question: "Which HTTP status code would best inform a client that they have exceeded the token-bucket rate limit ceiling (1,200 RPS)?",
      options: [
        "400 Bad Request",
        "403 Forbidden",
        "429 Too Many Requests",
        "502 Bad Gateway"
      ],
      answer: 2,
      explanation: "HTTP 429 Too Many Requests is the standard status code indicating that the client has exceeded rate limits, typically accompanied by a 'Retry-After' response header."
    }
  ];

  let currentIdx = 0;
  let userAnswers = new Array(questions.length).fill(null);
  let secondsElapsed = 0;
  let timerInterval = null;

  function startTimer() {
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `⏱ ${mins}:${secs}`;
    }, 1000);
  }

  function renderQuestion() {
    const q = questions[currentIdx];
    document.getElementById('q-counter').textContent = `Question ${currentIdx + 1} of ${questions.length}`;
    document.getElementById('q-text').textContent = q.question;

    const snippetEl = document.getElementById('q-snippet');
    if (q.snippet) {
      snippetEl.style.display = 'block';
      snippetEl.textContent = q.snippet;
    } else {
      snippetEl.style.display = 'none';
    }

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((optText, index) => {
      const optDiv = document.createElement('div');
      optDiv.className = `option ${userAnswers[currentIdx] === index ? 'selected' : ''}`;
      optDiv.onclick = () => selectOption(index);

      optDiv.innerHTML = `
        <div class="option-letter">${letters[index]}</div>
        <div>${optText}</div>
      `;
      optionsContainer.appendChild(optDiv);
    });

    // Update progress bar
    const progress = ((currentIdx + 1) / questions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progress}%`;

    // Navigation buttons
    document.getElementById('prev-btn').disabled = currentIdx === 0;
    const nextBtn = document.getElementById('next-btn');
    if (currentIdx === questions.length - 1) {
      nextBtn.textContent = 'Submit Quiz';
      nextBtn.style.background = 'var(--success)';
      nextBtn.style.color = '#ffffff';
    } else {
      nextBtn.textContent = 'Next';
      nextBtn.style.background = 'var(--primary)';
      nextBtn.style.color = '#0f172a';
    }
  }

  function selectOption(index) {
    userAnswers[currentIdx] = index;
    renderQuestion();
  }

  function prevQuestion() {
    if (currentIdx > 0) {
      currentIdx--;
      renderQuestion();
    }
  }

  function nextQuestion() {
    if (currentIdx < questions.length - 1) {
      currentIdx++;
      renderQuestion();
    } else {
      submitQuiz();
    }
  }

  function submitQuiz() {
    clearInterval(timerInterval);
    let score = 0;
    questions.forEach((q, i) => {
      if (userAnswers[i] === q.answer) score++;
    });

    const percent = Math.round((score / questions.length) * 100);
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('timer-display').style.display = 'none';
    document.getElementById('progress-bar').style.width = '100%';

    const resultView = document.getElementById('result-view');
    resultView.style.display = 'block';

    let reviewHtml = '';
    const letters = ['A', 'B', 'C', 'D'];
    questions.forEach((q, i) => {
      const isCorrect = userAnswers[i] === q.answer;
      const userChoice = userAnswers[i] !== null ? `${letters[userAnswers[i]]}. ${q.options[userAnswers[i]]}` : 'Unanswered';
      const correctChoice = `${letters[q.answer]}. ${q.options[q.answer]}`;

      reviewHtml += `
        <div class="review-item">
          <span class="review-status ${isCorrect ? 'status-correct' : 'status-incorrect'}">
            ${isCorrect ? '✓ Correct' : '✕ Incorrect'}
          </span>
          <div class="review-question">${i + 1}. ${q.question}</div>
          <div class="review-ans">Your Answer: <span>${userChoice}</span></div>
          ${!isCorrect ? `<div class="review-ans">Correct Answer: <span>${correctChoice}</span></div>` : ''}
          <div class="review-explanation"><strong>Analysis:</strong> ${q.explanation}</div>
        </div>
      `;
    });

    resultView.innerHTML = `
      <div class="result-container">
        <div class="score-circle" style="--percent: ${percent};">
          <div class="score-circle-inner">
            ${percent}%
            <span class="score-total">${score}/${questions.length}</span>
          </div>
        </div>
        <h2 class="result-title">${percent >= 80 ? 'Mastery Demonstrated!' : percent >= 60 ? 'Solid Comprehension' : 'Keep Practicing'}</h2>
        <p class="result-desc">You completed the Technical Documentation comprehension evaluation in ${document.getElementById('timer-display').textContent.replace('⏱ ', '')}.</p>
        <button class="btn btn-restart" onclick="restartQuiz()">Retake Quiz</button>
      </div>
      <div class="review-list">
        ${reviewHtml}
      </div>
    `;
  }

  function restartQuiz() {
    currentIdx = 0;
    userAnswers = new Array(questions.length).fill(null);
    secondsElapsed = 0;
    document.getElementById('timer-display').style.display = 'flex';
    document.getElementById('quiz-body').style.display = 'block';
    document.getElementById('result-view').style.display = 'none';
    startTimer();
    renderQuestion();
  }

  // Initialize
  startTimer();
  renderQuestion();
</script>
</body>
</html>
