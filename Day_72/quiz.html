<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 72 Quiz: Legal Terms & Terms of Service</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --accent: #ec4899;
      --option-bg: #334155;
      --option-hover: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    .badge {
      background: rgba(99, 102, 241, 0.15);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .timer {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 9999px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-count {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
      color: #ffffff;
    }

    .legal-clause {
      background: #141724;
      border-left: 4px solid var(--primary);
      padding: 12px 18px;
      border-radius: 0 8px 8px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      color: #c7d2fe;
      margin-bottom: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .option {
      background: var(--option-bg);
      border: 2px solid transparent;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: var(--text);
    }

    .option:hover {
      background: var(--option-hover);
      border-color: #475569;
    }

    .option.selected {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
    }

    .option-letter {
      background: rgba(255, 255, 255, 0.1);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .option.selected .option-letter {
      background: var(--primary);
      color: #ffffff;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-prev {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .btn-prev:hover:not(:disabled) {
      background: #334155;
      color: var(--text);
    }

    .btn-next {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-next:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Score & Review Page */
    .result-container {
      text-align: center;
      padding: 10px 0;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: conic-gradient(var(--primary) calc(var(--percent) * 1%), #334155 0);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score-circle-inner {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .score-total {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .result-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-desc {
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .review-list {
      text-align: left;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .review-item {
      background: #151e2e;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
    }

    .review-question {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .review-status {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .status-correct {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .status-incorrect {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .review-ans {
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .review-ans span {
      font-weight: 600;
      color: var(--text);
    }

    .review-explanation {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #334155;
      font-size: 0.85rem;
      color: #a5b4fc;
      line-height: 1.4;
    }

    .btn-restart {
      margin-top: 24px;
      background: var(--primary);
      color: #ffffff;
      padding: 12px 28px;
    }

    .btn-restart:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

<div class="container" id="quiz-card">
  <div class="header">
    <span class="badge">Day 72 • Legal Literacy</span>
    <span class="timer" id="timer-display">⏱ 00:00</span>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div id="quiz-body">
    <div class="question-count" id="q-counter">Question 1 of 5</div>
    <div class="question-text" id="q-text">Loading question...</div>
    <div id="q-clause" class="legal-clause" style="display: none;"></div>

    <div class="options" id="options-container">
      <!-- Options injected by JS -->
    </div>

    <div class="footer">
      <button class="btn btn-prev" id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
      <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">Next</button>
    </div>
  </div>

  <div id="result-view" style="display: none;">
    <!-- Injected after submission -->
  </div>
</div>

<script>
  const questions = [
    {
      question: "In legal contract drafting, what function does the transitional phrase 'Notwithstanding the foregoing' perform?",
      legalClause: "\"Customer retains ownership of Customer Data. Notwithstanding the foregoing, Customer grants Company a license to process and train models on said data...\"",
      options: [
        "It emphasizes that the previous sentence has zero exceptions and cannot be modified.",
        "It acts as a legal qualifier meaning 'regardless of what was just stated', introducing an operative exception that overrides the prior rule.",
        "It indicates that the contract has been cancelled by mutual consent.",
        "It specifies the physical jurisdiction where lawsuits must be filed."
      ],
      answer: 1,
      explanation: "'Notwithstanding the foregoing' means 'in spite of what was just stated'. It introduces an exception that takes legal precedence over the general statement immediately preceding it."
    },
    {
      question: "If an enterprise client pays $5,000 annually for a cloud service and suffers $500,000 in damages from a catastrophic system outage, what is the maximum recovery under this clause?",
      legalClause: "\"IN NO EVENT SHALL AGGREGATE LIABILITY EXCEED THE TOTAL AMOUNT ACTUALLY PAID BY CUSTOMER HEREUNDER IN THE TWELVE (12) MONTHS PRECEDING THE INCIDENT.\"",
      options: [
        "$500,000",
        "$5,000",
        "$50,000",
        "$0"
      ],
      answer: 1,
      explanation: "A standard Limitation of Liability clause caps recoverable damages strictly at the total fees paid by the customer over the preceding 12-month period, which is exactly $5,000."
    },
    {
      question: "What legal right is surrendered when a user agrees to a 'Mandatory Individual Arbitration and Class Action Waiver' clause?",
      legalClause: "\"CUSTOMER WAIVES ANY RIGHT TO COMMENCE OR PARTICIPATE IN ANY CLASS ACTION, COLLECTIVE ACTION, OR REPRESENTATIVE PROCEEDING...\"",
      options: [
        "The right to export their customer profile data to a CSV file.",
        "The right to file a public civil lawsuit with a jury alongside other affected customers.",
        "The right to cancel their subscription at the end of the billing month.",
        "The right to write reviews about the product on social media."
      ],
      answer: 1,
      explanation: "Mandatory binding arbitration and class-action waivers force disputes into private individual arbitration tribunals, stripping consumers of their right to a public trial before a jury or participation in collective class actions."
    },
    {
      question: "What does an 'AS IS' disclaimer of warranties communicate regarding software reliability?",
      legalClause: "\"THE SERVICES ARE PROVIDED STRICTLY ON AN 'AS IS' AND 'AS AVAILABLE' BASIS. PROVIDER EXPRESSLY DISCLAIMS ALL WARRANTIES, EXPRESS OR IMPLIED...\"",
      options: [
        "The software provider guarantees 100% bug-free uptime.",
        "The company disclaims any legal promise that the service is free of errors, secure, or fit for any particular business purpose.",
        "The software can only be used on computers manufactured in the United States.",
        "The code is open-source and free for public modification."
      ],
      answer: 1,
      explanation: "'AS IS' denies any implied or express warranty that the product is free of bugs, uninterrupted, or suitable for the customer's specific use case, shifting technical risk entirely onto the buyer."
    },
    {
      question: "Why should an enterprise scrutinize a clause granting a 'perpetual, royalty-free license to use data to optimize machine learning architectures'?",
      options: [
        "Because it requires the client to pay additional royalties each time an AI model generates text.",
        "Because it grants the provider rights to permanently ingest confidential customer data and code into proprietary AI models that might expose trade secrets.",
        "Because it deletes the client's account automatically after 30 days.",
        "Because it forces the client to purchase specialized GPU hardware."
      ],
      answer: 1,
      explanation: "Granting a perpetual license to use customer data to train machine learning models allows the vendor to permanently assimilate confidential inputs, trade secrets, and codebases into general models."
    }
  ];

  let currentIdx = 0;
  let userAnswers = new Array(questions.length).fill(null);
  let secondsElapsed = 0;
  let timerInterval = null;

  function startTimer() {
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `⏱ ${mins}:${secs}`;
    }, 1000);
  }

  function renderQuestion() {
    const q = questions[currentIdx];
    document.getElementById('q-counter').textContent = `Question ${currentIdx + 1} of ${questions.length}`;
    document.getElementById('q-text').textContent = q.question;

    const clauseEl = document.getElementById('q-clause');
    if (q.legalClause) {
      clauseEl.style.display = 'block';
      clauseEl.textContent = q.legalClause;
    } else {
      clauseEl.style.display = 'none';
    }

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((optText, index) => {
      const optDiv = document.createElement('div');
      optDiv.className = `option ${userAnswers[currentIdx] === index ? 'selected' : ''}`;
      optDiv.onclick = () => selectOption(index);

      optDiv.innerHTML = `
        <div class="option-letter">${letters[index]}</div>
        <div>${optText}</div>
      `;
      optionsContainer.appendChild(optDiv);
    });

    const progress = ((currentIdx + 1) / questions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progress}%`;

    document.getElementById('prev-btn').disabled = currentIdx === 0;
    const nextBtn = document.getElementById('next-btn');
    if (currentIdx === questions.length - 1) {
      nextBtn.textContent = 'Submit Quiz';
      nextBtn.style.background = 'var(--success)';
      nextBtn.style.color = '#ffffff';
    } else {
      nextBtn.textContent = 'Next';
      nextBtn.style.background = 'var(--primary)';
      nextBtn.style.color = '#ffffff';
    }
  }

  function selectOption(index) {
    userAnswers[currentIdx] = index;
    renderQuestion();
  }

  function prevQuestion() {
    if (currentIdx > 0) {
      currentIdx--;
      renderQuestion();
    }
  }

  function nextQuestion() {
    if (currentIdx < questions.length - 1) {
      currentIdx++;
      renderQuestion();
    } else {
      submitQuiz();
    }
  }

  function submitQuiz() {
    clearInterval(timerInterval);
    let score = 0;
    questions.forEach((q, i) => {
      if (userAnswers[i] === q.answer) score++;
    });

    const percent = Math.round((score / questions.length) * 100);
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('timer-display').style.display = 'none';
    document.getElementById('progress-bar').style.width = '100%';

    const resultView = document.getElementById('result-view');
    resultView.style.display = 'block';

    let reviewHtml = '';
    const letters = ['A', 'B', 'C', 'D'];
    questions.forEach((q, i) => {
      const isCorrect = userAnswers[i] === q.answer;
      const userChoice = userAnswers[i] !== null ? `${letters[userAnswers[i]]}. ${q.options[userAnswers[i]]}` : 'Unanswered';
      const correctChoice = `${letters[q.answer]}. ${q.options[q.answer]}`;

      reviewHtml += `
        <div class="review-item">
          <span class="review-status ${isCorrect ? 'status-correct' : 'status-incorrect'}">
            ${isCorrect ? '✓ Correct' : '✕ Incorrect'}
          </span>
          <div class="review-question">${i + 1}. ${q.question}</div>
          <div class="review-ans">Your Answer: <span>${userChoice}</span></div>
          ${!isCorrect ? `<div class="review-ans">Correct Answer: <span>${correctChoice}</span></div>` : ''}
          <div class="review-explanation"><strong>Legal Analysis:</strong> ${q.explanation}</div>
        </div>
      `;
    });

    resultView.innerHTML = `
      <div class="result-container">
        <div class="score-circle" style="--percent: ${percent};">
          <div class="score-circle-inner">
            ${percent}%
            <span class="score-total">${score}/${questions.length}</span>
          </div>
        </div>
        <h2 class="result-title">${percent >= 80 ? 'Exceptional Legal Literacy!' : percent >= 60 ? 'Competent Contract Analysis' : 'Brush Up on Legalese'}</h2>
        <p class="result-desc">You navigated digital contracts, arbitration waivers, and privacy clauses in ${document.getElementById('timer-display').textContent.replace('⏱ ', '')}.</p>
        <button class="btn btn-restart" onclick="restartQuiz()">Retake Quiz</button>
      </div>
      <div class="review-list">
        ${reviewHtml}
      </div>
    `;
  }

  function restartQuiz() {
    currentIdx = 0;
    userAnswers = new Array(questions.length).fill(null);
    secondsElapsed = 0;
    document.getElementById('timer-display').style.display = 'flex';
    document.getElementById('quiz-body').style.display = 'block';
    document.getElementById('result-view').style.display = 'none';
    startTimer();
    renderQuestion();
  }

  startTimer();
  renderQuestion();
</script>
</body>
</html>
